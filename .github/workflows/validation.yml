name: Repository validation

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Metadata and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project metadata
        run: python Scripts/validate_project.py
      - name: Run unit tests
        run: python -m unittest discover -s Tests -v
      - name: Compile and run battery inventory C++ regression tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I Source/TheLastSignal/Public \
            Tests/test_battery_inventory.cpp \
            -o /tmp/test_battery_inventory
          /tmp/test_battery_inventory
      - name: Compile and run Stalker melee rules regression tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I Source/TheLastSignal/Public \
            Tests/test_stalker_melee_rules.cpp \
            -o /tmp/test_stalker_melee_rules
          /tmp/test_stalker_melee_rules
